name: Personal WeFlow AI preview checks

on:
  pull_request:
    paths:
      - "tools/ai-bridge/**"
      - "web/src/ai/**"
      - "web/src/chat/useChatPage.tsx"
      - ".github/workflows/personal-ai.yml"
  push:
    branches:
      - "feat/llm-local-chat-analysis"
    paths:
      - "tools/ai-bridge/**"
      - "web/src/ai/**"
      - "web/src/chat/useChatPage.tsx"
      - ".github/workflows/personal-ai.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-guards:
    name: Bridge guard tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # One command, so that its exit code is the step's: pwsh goes on after a failed line of a
      # multi-line script, and a syntax error in main.mjs once passed this step unnoticed.
      - name: Validate bridge modules
        working-directory: tools/ai-bridge
        run: npm run check
      - name: Test local authentication, pairing, cancellation and input bounds
        working-directory: tools/ai-bridge
        run: npm test
      - name: Parse the Windows launcher scripts
        working-directory: tools/ai-bridge
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in Get-ChildItem -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Host "$($script.Name): $_" } }
          }
          if ($failed) { exit 1 }

  webui:
    name: WebUI typecheck, tests and build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: personal-weflow-ai-webui-windows
          path: web/dist/
          retention-days: 7

  backend-windows-x64:
    name: Build API v3 Windows backend for AI preview
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustup target add x86_64-pc-windows-msvc
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          key: preview-x86_64-windows-msvc-release
          save-if: false
      - name: Build preview backend (no account data)
        shell: pwsh
        run: cargo build --release -p weflow-cli --target x86_64-pc-windows-msvc
      - name: Smoke test preview executable
        shell: pwsh
        run: |
          & "./target/x86_64-pc-windows-msvc/release/weflow.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Preview backend executable failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: personal-weflow-api-v3-windows-x64
          path: target/x86_64-pc-windows-msvc/release/weflow.exe
          retention-days: 7
