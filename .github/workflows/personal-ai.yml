name: Personal WeFlow AI preview checks

on:
  pull_request:
    paths:
      - "tools/ai-bridge/**"
      - "web/src/ai/**"
      - "web/src/chat/useChatPage.tsx"
      - ".github/workflows/personal-ai.yml"
  push:
    branches:
      - "feat/llm-local-chat-analysis"
    paths:
      - "tools/ai-bridge/**"
      - "web/src/ai/**"
      - "web/src/chat/useChatPage.tsx"
      - ".github/workflows/personal-ai.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-guards:
    name: Bridge guard tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate bridge modules
        working-directory: tools/ai-bridge
        shell: pwsh
        run: |
          node --check main.mjs
          node --check guard.mjs
          node --check panel.js
          node --check preload.cjs
      - name: Test local authentication and input bounds
        working-directory: tools/ai-bridge
        run: node --test test/guard.test.mjs test/session.test.mjs

  webui:
    name: WebUI typecheck, tests and build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: personal-weflow-ai-webui-windows
          path: web/dist/
          retention-days: 7

  backend-windows-x64:
    name: Build API v3 Windows backend for AI preview
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustup target add x86_64-pc-windows-msvc
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          key: preview-x86_64-windows-msvc-release
          save-if: false
      - name: Build preview backend (no account data)
        shell: pwsh
        run: cargo build --release -p weflow-cli --target x86_64-pc-windows-msvc
      - name: Smoke test preview executable
        shell: pwsh
        run: |
          & "./target/x86_64-pc-windows-msvc/release/weflow.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Preview backend executable failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: personal-weflow-api-v3-windows-x64
          path: target/x86_64-pc-windows-msvc/release/weflow.exe
          retention-days: 7
